<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tour Museum Kota Makassar</title>
    
    <!-- Pustaka CSS Pannellum -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    
    <!-- Pustaka JS Pannellum -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        #panorama {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>

    <h1>Virtual Tour Museum Kota Makassar</h1>
    
    <!-- Elemen tempat panorama akan dirender -->
    <div id="panorama"></div>

    <script>
    pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "images/gerbang-museum.jpeg", // Pastikan path gambarnya sesuai
        "autoLoad": true,
        
        // --- BAGIAN PENAMBAHAN HOTSPOT ---
        "hotSpots": [
            {
                "pitch": 2.1,          // Koordinat vertikal titik hotspot
                "yaw": 135.5,          // Koordinat horizontal titik hotspot
                "type": "info",        // Tipe hotspot berupa informasi teks
                "text": "Gerbang Utama Museum Kota Makassar" // Teks yang muncul saat hotspot diklik
            },
            {
                "pitch": -5.0,
                "yaw": -90.2,
                "type": "info",
                "text": "Informasi sejarah singkat bangunan museum."
            }
        ]
    });
    </script>

</body>
</html>
