<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Tour Museum Kota Makassar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0f172a; color: #fff; }
    header { padding: 14px 22px; background: #17243a; }
    h1 { margin: 0; font-size: 1.35rem; }
    .intro { margin: 6px 0 0; color: #d3e2f1; font-size: .95rem; }
    #panorama { width: 100%; height: calc(100vh - 116px); min-height: 380px; }
    footer { min-height: 46px; padding: 13px 22px; background: #17243a; color: #cbd5e1; font-size: .86rem; }
    footer span { color: #9bd8f2; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Virtual Tour Museum Kota Makassar</h1>
    <p class="intro">Geser untuk melihat sekitar. Klik ikon untuk masuk ke area berikutnya.</p>
  </header>
  <main><div id="panorama" aria-label="Interactive 360-degree museum tour"></div></main>
  <footer>Built with <span>Pannellum</span>, <span>Git</span> and <span>GitHub Pages</span>.</footer>

  <script>
    pannellum.viewer("panorama", {
      "default": {
        "firstScene": "gerbang", // Mulai dari Gerbang Museum
        "sceneFadeDuration": 700,
        "autoLoad": true,
        "hfov": 110,
        "escapeHTML": true
      },
      "scenes": {
        "gerbang": {
          "title": "Gerbang Museum",
          "type": "equirectangular",
          "panorama": "images/gerbang-museum.jpg.jpeg", 
          "yaw": 0,
          "hotSpots": [
            {"pitch": -3, "yaw": -100, "type": "scene", "text": "Masuk ke Pintu Masuk", "sceneId": "pintu"},
            {"pitch": 15, "yaw": -100, "type": "info", "text": "Selamat datang di Museum Kota Makassar!"}
          ]
        },
        "pintu": {
          "title": "Pintu Masuk Museum",
          "type": "equirectangular",
          "panorama": "images/pintu-masuk-museum.jpg.jpeg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": 0, "yaw": -85, "type": "scene", "text": "Lanjut ke Lobby", "sceneId": "lobby"},
            {"pitch": 10, "yaw": 20, "type": "scene", "text": "Kembali ke Gerbang", "sceneId": "gerbang"},
            {"pitch": 20, "yaw": -85, "type": "info", "text": "Area Pintu Masuk utama."}
          ]
        },
        "lobby": {
          "title": "Lobby Museum",
          "type": "equirectangular",
          "panorama": "images/lobby-museum.jpg.jpeg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": -6, "yaw": 50, "type": "scene", "text": "Masuk ke Ruangan 1", "sceneId": "ruangan1"},
            {"pitch": -6, "yaw": -100, "type": "scene", "text": "Kembali ke Pintu Masuk", "sceneId": "pintu"},
            {"pitch": 3, "yaw": -220, "type": "info", "text": "Area Lobby Museum."}
          ]
        },
        "ruangan1": {
          "title": "Ruangan 1 Museum",
          "type": "equirectangular",
          "panorama": "images/ruangan1.jpg.jpeg",
          "yaw": 0,
          "hotSpots": [
            {"pitch": -6, "yaw": -110, "type": "scene", "text": "Kembali ke Lobby", "sceneId": "lobby"},
            {"pitch": 8, "yaw": 3, "type": "info", "text": "Koleksi benda bersejarah di Ruangan 1."}
          ]
        }
      }
    });
  </script>
</body>
</html>
